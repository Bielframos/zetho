[extend]
useDefault = true

# Appwrite uses twoWayKey as a schema relationship identifier. Restrict this
# exception to that field under the generic API key detector.
[[allowlists]]
targetRules = ["generic-api-key"]
description = "Appwrite schema relationship identifiers"
condition = "AND"
regexTarget = "line"
paths = ['''(^|/)appwrite\.config\.json$''']
regexes = ['''^\s*"twoWayKey"\s*:\s*"[A-Za-z0-9_-]+"\s*,?\s*$''']
