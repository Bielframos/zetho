<main class="mx-auto md:grid grid-cols-[320px_1fr] gap-10 w-full max-w-4xl py-10 lg:mt-24 px-6">
  <header class="max-md:mb-10">
    <h1 class="text-3xl">Acesse sua conta</h1>
    <p class="text-gray-11 font-light mt-2">Ainda não possui uma? <a routerLink="/registrar"
        class="text-blue-9 hover:underline cursor-pointer">Registrar</a>
    </p>
  </header>

  <form #form="ngForm" (ngSubmit)="login(form)" class="flex flex-col gap-4">
    <ui-input type="email" label="E-mail" placeholder="bielframos@zerei.app" name="email" [(ngModel)]="email"
      required />
    <ui-input type="password" label="Senha" placeholder="Sua senha" name="password" [(ngModel)]="password" required />


    <button type="submit" class="ui-primary-btn mt-4">Entrar</button>
  </form>
</main>
