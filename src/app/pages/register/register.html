<main>
  <form #form="ngForm" (ngSubmit)="register(form)" class="flex flex-col">
    <ui-input label="Nome" type="text" name="name" placeholder="Seu nome" [(ngModel)]="name" required />
    <ui-input label="Gamertag" type="text" placeholder="Sua gamertag" name="gamertag" [(ngModel)]="gamertag" required />
    <ui-input label="E-mail" type="email" placeholder="Seu e-mail" name="email" [(ngModel)]="email" required />
    <ui-input label="Senha" type="password" placeholder="Sua senha" name="password" [(ngModel)]="password" required />
    <ui-input label="Confirme a senha" type="password" placeholder="Confirme sua senha" name="confirmPassword"
      [(ngModel)]="confirmPassword" required />

    <button type="submit" class="cursor-pointer">Registrar</button>
  </form>
</main>
