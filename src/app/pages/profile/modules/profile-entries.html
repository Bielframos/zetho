@if (controller.initialLoading()) {
<ui-loading></ui-loading>
} @else if (controller.games(); as games) {
<ul
  class="grid grid-cols-3 md:grid-cols-[repeat(auto-fill,minmax(120px,1fr))] gap-2 md:gap-4 max-md:p-4"
>
  @for (game of controller.games(); track game.$id) {
  <li class="flex flex-col">
    <ui-game-card [game]="game"></ui-game-card>
  </li>
  }
</ul>
@if (controller.hasMore()) {
<footer class="w-full flex justify-center mt-10">
  <button class="ui-primary-btn" (click)="controller.loadEntries()">
    Carregar mais
  </button>
</footer>
} } @else {
<div class="flex flex-col items-center max-md:p-10 h-full justify-center">
  <i class="ph-fill ph-game-controller text-[56px] text-blue-11 mb-4"></i>
  <h1
    class="text-center text-4xl md:text-5xl text-transparent bg-clip-text bg-linear-to-r to-blue-12 from-blue-11 max-w-xl font-bold pb-6"
  >
    Cada jogo tem uma história, comece a sua.
  </h1>
  <p class="text-xl text-center max-w-md mt-2">
    Busque por um jogo
    <span class="underline underline-offset-4 decoration-blue-9"
      >e crie um registro</span
    >
    para acompanhar sua jornada.
  </p>
</div>
}
