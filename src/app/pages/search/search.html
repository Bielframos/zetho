<main class="w-full max-w-5xl mx-auto px-6 md:px-10">
    <header class="text-gray-11 font-light mb-6">
        <h2>Buscando por <span class="font-normal text-gray-12">"{{ query() }}"</span></h2>
    </header>

    @if (searchGame(); as search) {
    @if (search.loading()) {
    <div class="w-full flex flex-col items-center py-6 gap-4">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"
            class="animate-spin">
            <path
                d="M18.3125 11.0996H1.3418L14.0645 23.8223C13.3937 23.9386 12.704 24 12 24C5.37258 24 0 18.6274 0 12C0 6.80406 3.30252 2.37992 7.92285 0.710938L18.3125 11.0996ZM12 0C18.6274 0 24 5.37258 24 12C24 17.1965 20.6963 21.6195 16.0752 23.2881L5.6875 12.9004H22.6582L9.93457 0.176758C10.6056 0.0603575 11.2957 0 12 0Z"
                fill="currentcolor" />
        </svg>
        <span class="text-gray-12">Buscando jogos</span>
    </div>
    } @else {
    @if (search.total() === 0) {
    <p>Nenhum jogo localizado.</p>
    } @else {
    <ul class="grid grid-cols-3 md:grid-cols-[repeat(4,minmax(100px,1fr))] gap-2 md:gap-4">
        @for (game of search.results(); track game.$id) {
        <li class="flex flex-col">
            <ui-game-card [game]="game"></ui-game-card>
        </li>
        }
    </ul>

    <nav class="flex my-10 w-full justify-center gap-4 items-center">
        <button (click)="search.prevPage()" [disabled]="search.page() <= 1" class="ui-secondary-btn" data-size="icon"><i
                class="ph ph-caret-left"></i></button>
        <span>Página {{ search.page() }} de {{ search.pageCount() }}</span>
        <button (click)="search.nextPage()" [disabled]="search.page() >= search.pageCount()" class="ui-secondary-btn"
            data-size="icon"><i class="ph ph-caret-right"></i></button>
    </nav>
    }
    }
    }
</main>
