<div class="flex flex-col gap-1.5">
  @if (label) {
  <label [for]="id || name" class="text-sm text-gray-12 px-4 text-start"
    >{{label}}</label
  >
  }

  <div class="relative flex w-full flex-1 items-center">
    @if(icon) {
    <i [class]="`absolute ph ph-${icon} ml-4 text-gray-11`"></i>
    }

    <input
      [type]="type"
      [id]="id || name"
      [name]="name"
      [placeholder]="placeholder"
      [required]="required"
      [disabled]="disabled"
      [value]="value"
      (input)="handleChange($event)"
      (blur)="handleBlur()"
      class="rounded-xl leading-[24px] h-[40px] px-4 w-full flex-1 py-1 font-light text-gray-12 outline-none focus:ring-2 focus:ring-blue-6 transition-colors duration-200 ease-in-out disabled:bg-transparent placeholder:text-gray-10"
      [ngClass]="{
        'bg-blue-2': variant === 'primary',
        'bg-blue-1/60 border border-gray-6': variant === 'secondary'
      }"
      [class.pl-12]="icon"
    />
  </div>
</div>
