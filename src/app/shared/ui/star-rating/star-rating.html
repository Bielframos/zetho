<div class="star-rating" [class.readonly]="readonly">
  @for(star of [0,1,2,3,4]; track $index; let i = $index) {
  <i
    class="{{ getStarClass(i) }}"
    (mousemove)="!readonly && onMouseMove($event, i)"
    (mouseleave)="!readonly && onMouseLeave()"
    (click)="!readonly && onClick()"
  ></i>
  }
</div>
