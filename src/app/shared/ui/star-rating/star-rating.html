<div
  class="inline-flex rounded focus:outline-none focus:ring-2 focus:ring-focus-ring"
  [class.opacity-50]="disabled"
  [attr.role]="readonly ? 'img' : 'slider'"
  [attr.tabindex]="readonly || disabled ? null : 0"
  [attr.aria-label]="readonly ? label + ': ' + value + ' de 5' : label"
  [attr.aria-valuemin]="readonly ? null : 0"
  [attr.aria-valuemax]="readonly ? null : 5"
  [attr.aria-valuenow]="readonly ? null : value"
  [attr.aria-valuetext]="readonly ? null : (value ? value + ' de 5 estrelas' : 'Sem nota')"
  [attr.aria-disabled]="disabled || null"
  (keydown)="onKeydown($event)"
  (mouseleave)="onMouseLeave()"
>
  @for (star of [0,1,2,3,4]; track star) {
  <span
    class="inline-flex items-center justify-center"
    [class]="readonly ? '' : 'h-11 w-8 cursor-pointer'"
    aria-hidden="true"
    (mousemove)="onMouseMove($event, star)"
    (click)="onClick($event, star)"
  >
    <i class="text-[28px] {{ getStarClass(star) }}"></i>
  </span>
  }
</div>
