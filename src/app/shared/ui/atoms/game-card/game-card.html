<ng-template #cardImg>
  @if (game()?.coverUrl) {
  <img
    [src]="game()?.coverUrl"
    [alt]="game()?.name + ' cover'"
    class="w-full h-auto"
  />
  } @else {
  <div class="fallback-cover">
    <h4>
      {{ game()?.name }}
      <span class="text-gray-11 font-light">{{ game()?.releaseYear }}</span>
    </h4>
  </div>
  }
</ng-template>

@if (readonlyMode()) {
<div
  class="base-card"
  [style.width.px]="width()"
  [style.view-transition-name]="game()!.$id"
>
  <ng-container [ngTemplateOutlet]="cardImg" />
</div>
} @else {
<a
  [routerLink]="['/app/jogo', game()?.slug]"
  class="base-card group relative"
  [style.width.px]="width()"
  [style.view-transition-name]="game()!.$id"
  (click)="updateGame()"
>
  <ng-container [ngTemplateOutlet]="cardImg" />

  @if (game()?.coverUrl) {
  <div class="hover-overlay">
    <h4>
      {{ game()?.name }}
      <span class="text-gray-11 font-light">{{ game()?.releaseYear }}</span>
    </h4>
  </div>
  }
</a>
}
