<ng-template #cardImg>
  @if (displayGame().coverUrl) {
  <img
    [src]="displayGame().coverUrl"
    [alt]="displayGame().name + ' cover'"
    class="w-full h-auto"
  />
  } @else {
  <div class="fallback-cover">
    <h4>
      {{ displayGame().name }}
      <span class="text-gray-11 font-light"
        >{{ displayGame().releaseYear }}</span
      >
    </h4>
  </div>
  }
</ng-template>

@if (readonlyMode()) {
<div
  class="base-card"
  [style.width.px]="width()"
  [style.view-transition-name]="displayGame().$id"
>
  <ng-container [ngTemplateOutlet]="cardImg" />
</div>
} @else {
<a
  [routerLink]="['/jogo', displayGame().slug]"
  class="base-card group relative"
  [style.width.px]="width()"
  [style.view-transition-name]="displayGame().$id"
  (click)="updateGame()"
>
  <ng-container [ngTemplateOutlet]="cardImg" />

  @if (displayGame().coverUrl) {
  <div class="hover-overlay">
    <h4>
      {{ displayGame().name }}
      <span class="text-gray-11 font-light"
        >{{ displayGame().releaseYear }}</span
      >
    </h4>
  </div>
  }
</a>
}
