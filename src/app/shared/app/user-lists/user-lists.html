<ol class="grid divide-y divide-gray-6" [class.md:grid-cols-2]="!disableGrid()">
  @for (list of lists(); track $index) {
  <ui-list-card [ownerGamertag]="ownerGamertag()" [list]="list"></ui-list-card>
  } @empty {
  <li class="col-span-full">
    @if (fromMe()) {
    <ui-empty-state
      icon="ph ph-list"
      title="Crie a sua primeira lista"
      description="Que tal organizar seus jogos favoritos em listas personalizadas?"
      headingLevel="h2"
    >
      <div class="mt-6">
        <app-new-list-dialog></app-new-list-dialog>
      </div>
    </ui-empty-state>
    } @else {
    <ui-empty-state
      icon="ph ph-list-dashes"
      title="Nenhuma lista pública encontrada"
      description="Este jogador ainda não criou nenhuma lista pública."
      headingLevel="h2"
    />
    }
  </li>
  }
</ol>
