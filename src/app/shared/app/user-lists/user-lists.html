<ol class="grid gap-2" [class.md:grid-cols-2]="!disableGrid()">
  @for (list of lists(); track $index) {
  <ui-list-card [ownerGamertag]="ownerGamertag()" [list]="list"></ui-list-card>
  } @empty { @if (fromMe()) {
  <li
    class="p-10 mt-4 col-span-2 flex flex-col items-center text-center bg-blue-2 rounded-2xl"
  >
    <i class="ph ph-list text-[32px] mb-2"></i>
    <h1 class="text-center text-2xl max-w-xl">Crie a sua primeira lista</h1>
    <p class="text-center max-w-md mt-2 mb-6 text-gray-11">
      Que tal organizar seus jogos favoritos em listas personalizadas?
    </p>

    <app-new-list-dialog></app-new-list-dialog>
  </li>
  } @else {
  <li class="p-6 text-center bg-blue-2 rounded-2xl text-gray-11">
    Nenhuma lista pública encontrada.
  </li>
  } }
</ol>
