<section class="flex flex-1 items-center justify-center px-6 py-10">
  <div class="w-full max-w-md rounded-2xl bg-blue-2 p-8 text-center">
    <p class="mb-4 text-xs uppercase tracking-[0.24em] text-blue-11">
      Você está offline
    </p>
    <i class="ph ph-globe-simple-x text-[32px]"></i>
    <h1 class="text-3xl">Sem conexão com a internet</h1>
    <p class="mt-3 text-gray-11">
      Nao foi possivel conectar ao Zetho agora. Verifique sua internet e tente
      novamente.
    </p>
    <button
      type="button"
      class="ui-primary-btn mt-8 w-full justify-center"
      (click)="tryAgain()"
    >
      Tentar novamente
    </button>
  </div>
</section>
