<section>
  <header
    class="w-full flex justify-between items-end mb-4 p-4 md:rounded-2xl bg-gray-2"
  >
    <div>
      <h3 class="text-3xl max-w-xl">
        @if (itsMe) { Minhas listas } @else { Listas }
      </h3>
      <span class="text-gray-11"
        >{{controller.total()}} {{controller.total() > 1 ? "Listas" :
        "Lista"}}</span
      >
    </div>
    @if (itsMe) {
    <app-new-list-dialog></app-new-list-dialog>
    }
  </header>

  <app-user-lists
    [lists]="controller.lists()"
    [disableGrid]="true"
  ></app-user-lists>
</section>
