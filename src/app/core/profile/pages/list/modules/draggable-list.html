<div
  cdkDropList
  (cdkDropListDropped)="drop($event)"
  class="divide-y divide-gray-6"
>
  @for (item of controller.items(); let idx = $index; track item.$id) {
  <div
    cdkDrag
    [cdkDragDisabled]="!itsMe()"
    class="flex gap-4 pl-2 pr-4 py-4 md:py-2 items-center font-light relative"
  >
    @if (itsMe()) {
    <div class="cursor-grab" cdkDragHandle (click)="$event.stopPropagation()">
      <i class="ph ph-dots-six-vertical text-gray-11"></i>
    </div>
    }

    <a
      [routerLink]="['/jogo', item.game.slug]"
      class="flex gap-4 items-center flex-1"
    >
      <ui-game-card [width]="64" [game]="item.game" transitionScope="list" [transitionItemId]="item.$id" readonlyMode></ui-game-card>

      <span
        class="font-normal font-mono text-gray-11 px-3 rounded-full bg-gray-3 w-fit"
      >
        {{idx + 1}}
      </span>

      <span>{{ item.game.name }} </span>
    </a>

    @if (itsMe()) {
    <app-list-card-menu [item]="item"></app-list-card-menu>
    }
  </div>
  } @empty {
      @if (itsMe()) {
    <ui-empty-state
      icon="ph ph-list-plus"
      title="Essa lista está vazia"
      description="Busque jogos para adicionar e começar a organizar esta lista."
      actionLabel="Buscar jogos"
      actionLink="/buscar"
      headingLevel="h2"
    />
    } @else {
    <ui-empty-state
      icon="ph ph-list-dashes"
      title="Essa lista está vazia"
      description="Nenhum jogo foi adicionado a esta lista ainda."
      headingLevel="h2"
    />
    }
  }
</div>

@if (controller.hasMore()) {
<footer class="w-full flex justify-center mt-6">
  <button class="ui-primary-btn" (click)="controller.load({loadMore: true})">
    Carregar mais
  </button>
</footer>
}
