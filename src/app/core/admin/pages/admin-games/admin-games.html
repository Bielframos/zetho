<div class="bg-gray-2 rounded-2xl p-4 md:p-6">
  <header class="pb-4 border-b border-gray-6">
    <h2 class="text-xl md:text-2xl">Games</h2>
    <p class="text-gray-11">
      Cadastre jogos na base do Zetho usando o ID do IGDB.
    </p>
  </header>

  <form class="mt-4 flex flex-col items-end" (submit)="addGame($event)">
    <div class="flex-1 mb-4 w-full">
      <ui-input
        label="ID no IGDB"
        id="igdbId"
        type="number"
        min="1"
        [formControl]="igdbIdControl"
        placeholder="Ex.: 7346"
        variant="secondary"
      />
      @if (igdbIdControl.touched && igdbIdControl.invalid) {
      <small class="text-red-300 px-4"
        >Informe um ID válido maior que zero.</small
      >
      }
    </div>

    <button class="ui-primary-btn w-fit" type="submit" [disabled]="loading()">
      @if (loading()) { Cadastrando... } @else { Cadastrar jogo }
    </button>
  </form>

  @if (response(); as result) {
  <div
    class="mt-4 p-3 rounded-lg border border-green-700/40 bg-green-900/20 text-green-200"
  >
    <p>{{result.message}}</p>
    <small>ID interno: {{result.gameId}}</small>
  </div>
  } @if (error(); as message) {
  <div
    class="mt-4 p-3 rounded-lg border border-red-700/40 bg-red-900/20 text-red-200"
  >
    {{message}}
  </div>
  }
</div>
