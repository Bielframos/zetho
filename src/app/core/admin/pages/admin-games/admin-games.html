<section>
  <header class="p-4 border-b border-gray-6">
    <h2 class="text-xl md:text-2xl">Games</h2>
    <p class="text-gray-11">
      Cadastre jogos na base do Zetho usando o ID do IGDB.
    </p>
  </header>

  <form class="p-4 flex flex-col items-end" (submit)="addGame($event)">
    <div class="flex-1 mb-4 w-full">
      <ui-input
        label="ID no IGDB"
        id="igdbId"
        type="number"
        min="1"
        [formControl]="igdbIdControl"
        placeholder="Ex.: 7346"
        variant="secondary"
      />
      @if (igdbIdControl.touched && igdbIdControl.invalid) {
      <small class="text-danger px-4"
        >Informe um ID válido maior que zero.</small
      >
      }
    </div>

    <button class="ui-primary-btn w-fit" type="submit" [disabled]="loading()">
      @if (loading()) {
      <ui-loading
        [inline]="true"
        size="sm"
        fallback="Cadastrando..."
      ></ui-loading>
      } @else { Cadastrar jogo }
    </button>
  </form>

  @if (response(); as result) {
  <div
    class="mt-4 p-3 rounded-lg border border-success-line bg-success-bg text-success"
  >
    <p>{{result.message}}</p>
    <small>ID interno: {{result.gameId}}</small>
  </div>
  } @if (error(); as message) {
  <div
    class="mt-4 p-3 rounded-lg border border-danger-line bg-danger-bg text-danger"
  >
    {{message}}
  </div>
  }
</section>
