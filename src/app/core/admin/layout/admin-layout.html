<main class="w-full py-4 md:py-8">
  <div class="w-full mx-auto grid grid-cols-1 lg:grid-cols-[240px_1fr]">
    <aside class="h-fit p-3 lg:sticky lg:top-4 border-b lg:border-b-0 lg:border-r border-gray-6">
      <header class="pb-4 border-b border-gray-6">
        <h1 class="text-2xl">Painel Admin</h1>
        <p class="text-sm text-gray-11">
          Gerencie jogos e perfis da plataforma.
        </p>
      </header>

      <nav class="mt-3 flex lg:flex-col overflow-x-auto gap-1">
        <a
          routerLink="games"
          routerLinkActive="bg-gray-3 text-gray-12 hover:bg-gray-4"
          [routerLinkActiveOptions]="{ exact: true }"
          class="min-w-max px-3 py-2 rounded-lg text-gray-11 hover:bg-gray-3 hover:text-gray-12 transition-colors"
        >
          Games
        </a>

        <a
          routerLink="perfis"
          routerLinkActive="bg-gray-3 text-gray-12 hover:bg-gray-4"
          class="min-w-max px-3 py-2 rounded-lg text-gray-11 hover:bg-gray-3 hover:text-gray-12 transition-colors"
        >
          Perfis
        </a>

        <a
          routerLink="sorteios"
          routerLinkActive="bg-gray-3 text-gray-12 hover:bg-gray-4"
          class="min-w-max px-3 py-2 rounded-lg text-gray-11 hover:bg-gray-3 hover:text-gray-12 transition-colors"
        >
          Sorteios
        </a>
      </nav>
    </aside>

    <section class="w-full max-w-5xl mx-auto min-w-0">
      <router-outlet></router-outlet>
    </section>
  </div>
</main>
