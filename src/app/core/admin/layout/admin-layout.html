<main class="w-full px-4 md:px-6 lg:px-10 py-4 md:py-8">
  <div class="w-full mx-auto grid grid-cols-1 lg:grid-cols-[260px_1fr] gap-4">
    <aside class="bg-blue-2 rounded-2xl h-fit p-3 lg:sticky lg:top-4">
      <header class="pb-4 border-b border-gray-6">
        <h1 class="text-2xl">Painel Admin</h1>
        <p class="text-sm text-gray-11">
          Gerencie jogos e perfis da plataforma.
        </p>
      </header>

      <nav class="mt-3 flex lg:flex-col overflow-x-auto gap-1">
        <a
          routerLink="games"
          routerLinkActive="bg-blue-3 text-gray-12"
          [routerLinkActiveOptions]="{ exact: true }"
          class="min-w-max px-3 py-2 rounded-lg text-gray-11 hover:bg-blue-3 hover:text-gray-12 transition-colors"
        >
          Games
        </a>

        <a
          routerLink="perfis"
          routerLinkActive="bg-blue-3 text-gray-12"
          class="min-w-max px-3 py-2 rounded-lg text-gray-11 hover:bg-blue-3 hover:text-gray-12 transition-colors"
        >
          Perfis
        </a>
      </nav>
    </aside>

    <section class="w-full max-w-5xl mx-auto">
      <router-outlet></router-outlet>
    </section>
  </div>
</main>
