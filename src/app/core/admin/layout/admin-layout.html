<main class="w-full">
  <div class="w-full mx-auto">
    <header class="px-4 py-8 md:py-10 border-b border-gray-6">
      <div class="flex items-center gap-3">
        <div
          class="flex h-11 w-11 shrink-0 items-center justify-center border border-gray-6"
        >
          <i class="ph ph-shield-star text-[24px] text-blue-11"></i>
        </div>

        <div>
          <h1 class="text-3xl md:text-4xl">Admin</h1>
        </div>
      </div>
    </header>

    <nav class="flex gap-1 overflow-x-auto border-b border-gray-6 px-4">
      <a
        routerLink="games"
        routerLinkActive="border-blue-9 text-gray-12"
        [routerLinkActiveOptions]="{ exact: true }"
        class="min-w-max border-b-2 border-transparent px-4 py-4 text-sm text-gray-10 transition-colors hover:text-gray-12"
      >
        Games
      </a>

      <a
        routerLink="perfis"
        routerLinkActive="border-blue-9 text-gray-12"
        class="min-w-max border-b-2 border-transparent px-4 py-4 text-sm text-gray-10 transition-colors hover:text-gray-12"
      >
        Perfis
      </a>

      <a
        routerLink="sorteios"
        routerLinkActive="border-blue-9 text-gray-12"
        class="min-w-max border-b-2 border-transparent px-4 py-4 text-sm text-gray-10 transition-colors hover:text-gray-12"
      >
        Sorteios
      </a>

      <a
        routerLink="temas"
        routerLinkActive="border-blue-9 text-gray-12"
        class="min-w-max border-b-2 border-transparent px-4 py-4 text-sm text-gray-10 transition-colors hover:text-gray-12"
      >
        Temas
      </a>
      <a
        routerLink="/listas"
        routerLinkActive="border-blue-9 text-gray-12"
        class="min-w-max border-b-2 border-transparent px-4 py-4 text-sm text-gray-10"
        >Listas</a
      >
    </nav>

    <section class="w-full max-w-5xl mx-auto min-w-0">
      <router-outlet></router-outlet>
    </section>
  </div>
</main>
