<main
  class="mx-auto md:grid grid-cols-[320px_1fr] place-content-center h-full gap-10 w-full max-w-4xl py-10 lg:py-24 px-6">
  <header class="max-md:mb-10">
    <h1 class="text-3xl">Recupere sua senha</h1>
    <p class="text-gray-11 font-light mt-2">Lembrou da senha? <a routerLink="/entrar"
        class="text-blue-11 hover:text-link hover:underline cursor-pointer">Entrar</a>
    </p>
  </header>

  <form #form="ngForm" (ngSubmit)="createRecovery(form)" class="flex flex-col gap-4">
    <ui-input type="email" label="E-mail" placeholder="bielframos@zetho.app" name="email" [(ngModel)]="email"
      variant="secondary" required />

    @if (result().message) {
    <small class="rounded-lg border p-3" [class.border-danger-line]="result().error" [class.bg-danger-bg]="result().error" [class.text-danger]="result().error" [class.border-success-line]="result().success" [class.bg-success-bg]="result().success" [class.text-success]="result().success">
      {{ result().message }}
    </small>
    }

    <button type="submit" class="ui-primary-btn mt-4" [disabled]="isLoading()">
      @if (isLoading()) {
      <ui-loading [inline]="true" size="sm"></ui-loading>
      }
      Recuperar senha
    </button>
  </form>
</main>
