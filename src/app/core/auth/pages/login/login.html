<main
  class="relative isolate mx-auto md:grid grid-cols-[320px_1fr] gap-10 w-full max-w-4xl py-10 lg:py-24 px-6 h-full place-content-center">
  <header class="max-md:mb-10">
    <h1 class="text-3xl">Acesse sua conta</h1>
    <p class="text-gray-11 font-light mt-2">Ainda não possui uma? <a routerLink="/registrar"
        class="text-blue-9 hover:underline cursor-pointer">Registrar</a>
    </p>
  </header>

  <form #form="ngForm" (ngSubmit)="login(form)" class="flex flex-col gap-4">
    <ui-input type="email" label="E-mail" placeholder="bielframos@zetho.app" name="email" [(ngModel)]="email"
      required />
    <ui-input type="password" label="Senha" placeholder="Sua senha" name="password" [(ngModel)]="password" required />
    <a routerLink="/recuperar-senha" class="text-gray-11 hover:text-blue-12 hover:underline text-sm -mt-2 self-end">
      Esqueceu sua senha?
    </a>

    @if (result().message) {
    <small class="text-red-300">
      {{ result().message }}
    </small>
    }

    <button type="submit" class="ui-primary-btn mt-4" [disabled]="isLoading()">
      @if (isLoading()) {
      <i class="ph ph-spinner animate-spin"></i>
      }
      Entrar
    </button>
  </form>
</main>
