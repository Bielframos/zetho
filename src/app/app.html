<div class="flex flex-col min-h-dvh">
  <!-- Navbar -->
  <nav class="w-full px-4 md:px-10 pt-4 relative z-10">
    <div class="flex gap-4 justify-between items-center">
      <a [routerLink]="authStore.isAuthenticated() ? '/dashboard' : '/'">
        <h3 class="font-display text-[40px] leading-0">zetho</h3>
      </a>

      <div class="flex items-center gap-4">
        <!-- Barra de busca desktop — Só exibe se não for página de autenticação -->
        @if (!isAuthRoute()) {
        <div class="hidden md:block w-72">
          <app-search-input
            name="desktopSearchInput"
            placeholder="Busque um jogo ou player"
            (search)="onSearch($event)"
            (focusSearch)="onSearchInputFocus()"
          />
        </div>
        } @if (authStore.user()) {
        <a
          [routerLink]="['/player', authStore.profile()?.gamertag]"
          class="rounded-full overflow-hidden bg-blue-12"
        >
          <img
            [src]="authStore.avatarUrl()"
            alt="{{`Avatar do ${authStore.user()?.name}`}}"
            class="h-[34px] w-[34px] object-cover"
          />
        </a>
        } @else {
        <a routerLink="/registrar" class="ui-link">Criar conta</a>
        <a routerLink="/entrar" class="ui-link" data-size="icon"
          ><i class="ph ph-sign-in"> </i
        ></a>
        }
      </div>
    </div>

    <!-- Barra de busca mobile — Só exibe se não for página de autenticação -->
    @if (!isAuthRoute()) {
    <div class="md:hidden mt-4">
      <app-search-input
        name="mobileSearchInput"
        placeholder="Busque um jogo ou player"
        (search)="onSearch($event)"
        (focusSearch)="onSearchInputFocus()"
      />
    </div>
    }
  </nav>

  <!-- Roteamento dinâmico -->
  <div class="flex flex-col flex-1 min-h-fit route-transition-scope">
    <router-outlet />
  </div>

  @if (!isOfflineRoute()) {
  <!-- Footer do app -->
  <footer
    class="w-full flex justify-between items-center border-t border-blue-2 px-6 md:px-10 py-4 bg-blue-1 z-20"
  >
    <div>
      <h6 class="text-4xl font-display">Zetho</h6>

      <small class="text-gray-11"
        >Powered by
        <a
          href="https://www.igdb.com/"
          class="font-semibold"
          class="text-blue-12"
          >IGDB</a
        ></small
      >
    </div>

    @if (authStore.isAdmin()) {
    <a routerLink="/admin" class="ui-link h-fit">Painel administrativo</a>
    } @else {
    <div class="text-sm text-gray-11">
      <p>Feito por jogadores, para jogadores.</p>
    </div>
    }
  </footer>
  }
</div>

<!-- Toaster global -->
<app-toaster></app-toaster>
