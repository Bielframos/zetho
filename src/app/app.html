<div class="isolate">
  <svg viewBox="0 0 400 200" fill="none" xmlns="http://www.w3.org/2000/svg"
    class="absolute rotate-180 w-full max-w-5xl left-1/2 -translate-x-1/2 blur-3xl md:-top-1/3">
    <path
      d="M400 200C400 146.957 378.929 96.0859 341.421 58.5786C303.914 21.0714 253.043 4.00466e-06 200 0C146.957 -4.00466e-06 96.0859 21.0714 58.5787 58.5786C21.0714 96.0859 8.00932e-06 146.957 0 200L400 200Z"
      fill="url(#paint0_linear_2861_3)" />
    <defs>
      <linearGradient id="paint0_linear_2861_3" x1="200" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
        <stop stop-color="#182449" />
        <stop offset="1" stop-color="#9EB1FF" />
      </linearGradient>
    </defs>
  </svg>

  <nav class="w-full bg-blue-2 px-6 md:px-10 py-4 border-b border-gray-6 relative z-10">
    <div class="flex gap-4 justify-between items-center">
      <a routerLink="/"><img src="zerei-logo.svg" alt="Zerei Logo" class="h-5"></a>

      <div class="flex gap-4 items-center">
        <!-- Barra de busca desktop — Só exibe se não for página de autenticação -->
        @if (!isAuthRoute()) {
        <div class="hidden md:block">
          <ui-search-input placeholder="Busque um jogo" (search)="onSearch($event)" />
        </div>
        }

        @if (userStore.user()) {
        <a routerLink="/perfil" class="rounded-full overflow-hidden bg-blue-12"><img [src]="userStore.avatarUrl()"
            alt="{{`Avatar do ${userStore.user()?.name}`}}"></a>
        } @else {
        <a routerLink="/registrar" class="ui-link">Criar conta</a>
        <a routerLink="/entrar" class="ui-link" data-size="icon"><i class="ph ph-sign-in"></i></a>
        }
      </div>
    </div>

    <!-- Barra de busca mobile — Só exibe se não for página de autenticação -->
    @if (!isAuthRoute()) {
    <div class="md:hidden mt-4">
      <ui-search-input placeholder="Busque um jogo" (search)="onSearch($event)" />
    </div>
    }
  </nav>

  <div class="relative z-10">
    <router-outlet />
  </div>
</div>
