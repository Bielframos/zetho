<div>
  <nav class="flex w-full gap-4 justify-between px-4">
    <a routerLink="/">Zerei</a>

    <div class="flex gap-4">
      @if (authStore.user()) {
      <a routerLink="/perfil">{{authStore.user()?.name}}</a>
      <button (click)="authStore.logout()">Sair</button>
      } @else {
      <a routerLink="/registrar">Registrar</a>
      <a routerLink="/entrar">Entrar</a>
      }
    </div>
  </nav>

  <router-outlet />
</div>
